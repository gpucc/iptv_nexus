<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#111929"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70e000"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- 16:9 Standard Aspect Rectangle -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <rect x="2" y="2" width="636" height="356" rx="6" fill="none" stroke="#70e000" stroke-width="2" stroke-opacity="0.35"/>
  
  <!-- Top Bar: Flag & Country + Channel # -->
  <g transform="translate(24, 30)">
    <rect x="-6" y="-14" width="220" height="28" rx="4" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)"/>
    <text x="6" y="5" font-family="'Inter', sans-serif" font-size="14">🇺🇸</text>
    <text x="32" y="5" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">UNITED STATES • LOS ANGELES, CA</text>
  </g>
  
  <rect x="526" y="16" width="90" height="28" rx="4" fill="rgba(0,0,0,0.7)" stroke="#70e000" stroke-width="1"/>
  <text x="571" y="35" font-family="'Orbitron', monospace" font-size="13" font-weight="900" fill="#70e000" text-anchor="middle">CH 104</text>

  <!-- Central Holographic Seal -->
  <g transform="translate(320, 168)">
    <circle r="52" fill="none" stroke="url(#acc)" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.8"/>
    <circle r="44" fill="rgba(0,0,0,0.55)"/>
    <text y="-6" font-family="'Orbitron', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">DUST-SCI</text>
    <text y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#70e000" text-anchor="middle" letter-spacing="1.5">16:9 PREVIEW</text>
  </g>

  <!-- Titles -->
  <text x="320" y="260" font-family="'Inter', sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">Alien Nation by DUST</text>
  <text x="320" y="288" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Sci-Fi & Tech • Sci-Fi & Future Tech</text>
  <text x="320" y="308" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="rgba(0,245,212,0.8)" text-anchor="middle">Gunpowder & Sky</text>

  <!-- Footer Telemetry -->
  <line x1="24" y1="328" x2="616" y2="328" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="24" y="344" font-family="'Orbitron', monospace" font-size="9.5" fill="rgba(255,255,255,0.4)">RES: 1920x1080 (1080p FHD) • HLS STREAM • DVR READY</text>
  <text x="616" y="344" font-family="'Orbitron', monospace" font-size="9.5" fill="#70e000" text-anchor="end">QUAL: 98.4%</text>
</svg>